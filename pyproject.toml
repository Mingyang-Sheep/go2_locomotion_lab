[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["source/go2_locomotion_lab"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/evaluate.py" = ["E402"]
"scripts/export.py" = ["E402"]
"scripts/play.py" = ["E402"]
"scripts/train.py" = ["E402"]
"tests/smoke_env.py" = ["E402"]
"tests/smoke_official.py" = ["E402"]
